services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: pixelstrike-server
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/stats.db
      - MAP_PATH=/app/map.json
    volumes:
      - pixelstrike-data:/data

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: pixelstrike-client
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8000:80"
    depends_on:
      - server

volumes:
  pixelstrike-data:
    driver: local
