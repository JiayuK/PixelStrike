name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-strike-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          npm run build --prefix client &
          client_pid=$!
          (cd server && go test ./...) &
          server_pid=$!
          wait "$client_pid"
          wait "$server_pid"

      - name: Build production images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          (cd server && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../release/pixelstrike .)
          docker build -f deploy/server.Dockerfile -t pixel-strike-server:latest .
          docker build -f client/Dockerfile.remote -t pixel-strike-client:latest .
          docker save pixel-strike-server:latest pixel-strike-client:latest | gzip -1 > release/images.tar.gz
          cp docker-compose.prod.yml release/docker-compose.yml
          cp deploy/1panel-root.conf deploy/known_hosts deploy/remote.sh release/

      - name: Upload production release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ github.sha }}
          path: release/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://game.incrafttime.top
    env:
      DEPLOY_HOST: 183.92.11.135
      DEPLOY_PORT: "5173"
      DEPLOY_USER: root
      DEPLOY_PATH: /mnt/nvme0n1-6/Configs/1Panel/1panel/docker/compose/pixel-strike
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-${{ github.sha }}
          path: release

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pixel-strike
          chmod 600 ~/.ssh/pixel-strike
          cp release/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          remote_release="/tmp/pixel-strike-${GITHUB_SHA}"
          ssh_args=(-i ~/.ssh/pixel-strike -o IdentitiesOnly=yes -p "$DEPLOY_PORT")
          scp_args=(-i ~/.ssh/pixel-strike -o IdentitiesOnly=yes -P "$DEPLOY_PORT")
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$remote_release' && mkdir -p '$remote_release'"
          scp "${scp_args[@]}" release/* "$DEPLOY_USER@$DEPLOY_HOST:$remote_release/"
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sh '$remote_release/remote.sh' '$remote_release' '$DEPLOY_PATH'"
