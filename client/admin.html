<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#10130f">
  <title>PIXEL STRIKE / ADMIN</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Tahoma, "Microsoft YaHei", sans-serif;
      background: #0b0d0b;
      color: #f0eadc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(120deg, rgb(201 130 43 / .08), transparent 42%),
        repeating-linear-gradient(0deg, transparent 0 31px, rgb(240 234 220 / .025) 31px 32px),
        #0b0d0b;
    }
    main {
      width: min(620px, 100%);
      border: 1px solid #4a5145;
      border-top: 3px solid #c9822b;
      background: #171b16;
      box-shadow: 0 24px 70px rgb(0 0 0 / .55);
    }
    header, section { padding: 24px; }
    header { border-bottom: 1px solid #353b32; }
    .eyebrow, label, .meta, output {
      font: 700 11px/1.4 Consolas, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow, output { color: #e09a43; }
    h1 { margin: 8px 0 0; font: 700 clamp(34px, 8vw, 58px)/.95 Impact, "Arial Narrow", sans-serif; letter-spacing: .04em; }
    p { margin: 9px 0 0; color: #aaa99f; line-height: 1.6; }
    form, .stack { display: grid; gap: 14px; }
    label { display: grid; gap: 7px; color: #aaa99f; }
    input, button { width: 100%; min-height: 46px; border-radius: 0; font: inherit; }
    input {
      border: 1px solid #62695b;
      background: #0f120e;
      padding: 0 13px;
      color: #f0eadc;
      outline: none;
    }
    input:focus { border-color: #e09a43; box-shadow: 0 0 0 2px rgb(224 154 67 / .2); }
    input[type="range"] { padding: 0; accent-color: #c9822b; }
    button {
      border: 1px solid #c9822b;
      background: #c9822b;
      color: #17110a;
      cursor: pointer;
      font-weight: 800;
    }
    button:hover { background: #e09a43; }
    button.secondary { border-color: #62695b; background: #20251f; color: #f0eadc; }
    .row { display: flex; justify-content: space-between; align-items: end; gap: 16px; }
    output { font-size: 34px; letter-spacing: 0; }
    .pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .pills button { min-height: 38px; background: #20251f; border-color: #4a5145; color: #aaa99f; }
    .pills button.active { background: #c9822b; border-color: #e09a43; color: #17110a; }
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    #logout { width: auto; padding: 0 18px; }
    .status { min-height: 24px; font: 12px/1.5 Consolas, monospace; }
    .status.ok { color: #8fc787; }
    .status.error { color: #e0857d; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { header, section { padding: 19px; } .actions { grid-template-columns: 1fr; } #logout { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Restricted Operations Console</div>
      <h1>ADMIN</h1>
      <p>全局人机配置会立即应用到所有活动房间，并作为新房间的默认值。</p>
    </header>

    <section id="login-panel">
      <form id="login-form">
        <label>管理员密码
          <input id="password" type="password" autocomplete="current-password" required autofocus>
        </label>
        <button type="submit">验证并进入</button>
        <div id="login-status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section id="control-panel" hidden>
      <div class="stack">
        <div class="row">
          <div><div class="eyebrow">Global Bot Count</div><p id="room-status" class="meta"></p></div>
          <output id="count-output" for="count">6</output>
        </div>
        <label>每个房间的人机数量
          <input id="count" type="range" min="0" max="12" step="1" value="6">
        </label>
        <div class="pills" aria-label="快捷人机数量">
          <button type="button" data-count="0">0</button>
          <button type="button" data-count="2">2</button>
          <button type="button" data-count="6">6</button>
          <button type="button" data-count="10">10</button>
          <button type="button" data-count="12">12</button>
        </div>
        <div class="actions">
          <button id="apply" type="button">应用到全部房间</button>
          <button id="logout" class="secondary" type="button">退出</button>
        </div>
        <div id="control-status" class="status" role="status" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script type="module">
    const loginPanel = document.querySelector('#login-panel');
    const controlPanel = document.querySelector('#control-panel');
    const loginForm = document.querySelector('#login-form');
    const passwordInput = document.querySelector('#password');
    const loginStatus = document.querySelector('#login-status');
    const controlStatus = document.querySelector('#control-status');
    const roomStatus = document.querySelector('#room-status');
    const countInput = document.querySelector('#count');
    const countOutput = document.querySelector('#count-output');
    const pills = [...document.querySelectorAll('[data-count]')];
    let password = '';

    function showCount(value) {
      countInput.value = String(value);
      countOutput.value = String(value);
      pills.forEach((button) => button.classList.toggle('active', +button.dataset.count === +value));
    }

    async function request(method, bots) {
      const response = await fetch('/api/admin/bots', {
        method,
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
        body: method === 'POST' ? JSON.stringify({ bots }) : undefined,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(response.status === 401 ? '密码错误' : data.error || `请求失败 (${response.status})`);
      return data;
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginStatus.className = 'status';
      loginStatus.textContent = '正在验证…';
      password = passwordInput.value;
      try {
        const data = await request('GET');
        passwordInput.value = '';
        loginPanel.hidden = true;
        controlPanel.hidden = false;
        showCount(data.bots);
        roomStatus.textContent = `${data.rooms} 个活动房间`;
        loginStatus.textContent = '';
      } catch (error) {
        password = '';
        loginStatus.className = 'status error';
        loginStatus.textContent = error.message;
        passwordInput.select();
      }
    });

    countInput.addEventListener('input', () => showCount(countInput.value));
    pills.forEach((button) => button.addEventListener('click', () => showCount(button.dataset.count)));
    document.querySelector('#apply').addEventListener('click', async () => {
      controlStatus.className = 'status';
      controlStatus.textContent = '正在同步…';
      try {
        const data = await request('POST', +countInput.value);
        showCount(data.bots);
        roomStatus.textContent = `${data.rooms} 个活动房间`;
        controlStatus.className = 'status ok';
        controlStatus.textContent = `已应用：每个房间 ${data.bots} 个人机`;
      } catch (error) {
        controlStatus.className = 'status error';
        controlStatus.textContent = error.message;
      }
    });
    document.querySelector('#logout').addEventListener('click', () => location.reload());
  </script>
</body>
</html>
